<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roteirização por Latitude/Longitude</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background:#f3f4f6; }
    h1 { margin-bottom: 20px; }
    .card { background:white; padding:20px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    input { padding:8px; width:100%; margin-bottom:10px; }
    button { padding:10px 15px; border-radius:6px; border:0; cursor:pointer; }
    .btn-primary { background:#2563eb; color:white; }
    .btn-secondary { background:#e5e7eb; }
    table { width:100%; border-collapse:collapse; margin-top:20px; background:white; }
    th, td { padding:10px; border-bottom:1px solid #ddd; }
    th { background:#fafafa; }
  </style>
</head>
<body>
  <h1>Roteirizador com Latitude/Longitude</h1>
  <div class="card">

    <h3>Carregar planilha Excel</h3>
    <input type="file" id="fileInput" accept=".xlsx, .xls" />
    <button class="btn-primary" onclick="processExcel()">Processar Rotas</button>
    <button class="btn-secondary" onclick="exportarExcel()">Gerar Relatório</button>

    <table id="rotasTabela">
      <thead>
        <tr>
          <th>Origem</th>
          <th>Origem (Lat)</th>
          <th>Origem (Lng)</th>
          <th>Destino</th>
          <th>Destino (Lat)</th>
          <th>Destino (Lng)</th>
          <th>Distância (km)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
let rotas = [];

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const toRad = v => (v * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

function processExcel() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) {
    alert("Selecione um arquivo Excel primeiro!");
    return;
  }

  const reader = new FileReader();

  reader.onload = evt => {
    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data, { type: "array" });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet);

    rotas = [];

    rows.forEach(r => {
      if (r.CidadeOrigem && r.LatitudeOrigem && r.LongitudeOrigem && r.CidadeDestino && r.LatitudeDestino && r.LongitudeDestino) {
        const dist = haversine(r.LatitudeOrigem, r.LongitudeOrigem, r.LatitudeDestino, r.LongitudeDestino);
        transactions.push({
          origem_cidade: r.CidadeOrigem,
          origem_lat: r.LatitudeOrigem,
          origem_lng: r.LongitudeOrigem,
          destino_cidade: r.CidadeDestino,
          destino_lat: r.LatitudeDestino,
          destino_lng: r.LongitudeDestino,
          distancia_km: dist
        });
      }
    });

  reader.readAsArrayBuffer(file);
}

function renderTabela() {
  const tbody = document.querySelector('#rotasTabela tbody');
  tbody.innerHTML = '';

  rotas.forEach(t => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${t.origem_cidade}</td>
      <td>${t.origem_lat}</td>
      <td>${t.origem_lng}</td>
      <td>${t.destino_cidade}</td>
      <td>${t.destino_lat}</td>
      <td>${t.destino_lng}</td>
      <td>${t.distancia_km} km</td>`;
    tbody.appendChild(tr);
  });
}

function exportarExcel() {
  if (rotas.length === 0) {
    alert("Nenhuma rota processada para exportar!");
    return;
  }

  const ws = XLSX.utils.json_to_sheet(rotas);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Rotas Processadas");
  XLSX.writeFile(wb, "rotas_processadas.xlsx");
}

  </script>

</body>
</html>
