<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conciliação de Caixa</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        h1 { text-align: center; }
        input, select { width: 100%; padding: 8px; margin: 6px 0; }
        button { padding: 10px 15px; margin-right: 10px; cursor: pointer; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conciliação de Caixa</h1>

        <div class="btn-group">
            <button id="addBtn">Lançar</button>
            <button id="excelBtn">Gerar Relatório</button>
        </div>

        <label>Descrição:</label>
        <input type="text" id="descricao" placeholder="Ex.: Venda, Depósito..." />

        <label>Valor:</label>
        <input type="number" id="valor" placeholder="0.00" />

        <label>Tipo:</label>
        <select id="tipo">
            <option value="Entrada">Entrada</option>
            <option value="Saída">Saída</option>
        </select>

        <table>
            <thead>
                <tr>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Tipo</th>
                </tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </div>

    <script>
        const lista = document.getElementById("lista");
        const addBtn = document.getElementById("addBtn");
        const excelBtn = document.getElementById("excelBtn");

        addBtn.addEventListener("click", function () {
            const descricao = document.getElementById("descricao").value;
            const valor = document.getElementById("valor").value;
            const tipo = document.getElementById("tipo").value;

            if (!descricao || !valor) {
                alert("Preencha todos os campos.");
                return;
            }

            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${descricao}</td><td>${valor}</td><td>${tipo}</td>`;
            lista.appendChild(tr);

            document.getElementById("descricao").value = "";
            document.getElementById("valor").value = "";
        });

        // Exportar Excel simples
        excelBtn.addEventListener("click", function () {
            // Gera CSV independentemente de qualquer filtro ou data
            let csv = "Descrição,Valor,Tipo\n";
            const linhas = document.querySelectorAll("#lista tr");

            if (linhas.length === 0) {
                alert("Nenhuma transação para gerar relatório.");
                return;
            }

            linhas.forEach(row => {
                let cols = row.querySelectorAll("td");
                csv += `${cols[0].innerText},${cols[1].innerText},${cols[2].innerText}\n`;
            });

            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = "relatorio_conciliacao.csv";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

            const blob = new Blob([csv], { type: "text/csv" });
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = "relatorio_conciliacao.csv";
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
