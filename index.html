<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roteirização por Latitude/Longitude</title>
  <style>
    body {
      font-family: "Inter", Arial, sans-serif;
      padding: 24px;
      background: #eef1f5;
      color: #1f2937;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
      color: #111827;
    }
    .card {
      background: #ffffff;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      transition: 0.3s ease;
    }
    .card:hover {
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }
    input[type="file"] {
      padding: 14px;
      border: 2px dashed #9ca3af;
      background: #f9fafb;
      border-radius: 12px;
      width: 100%;
      margin-bottom: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    input[type="file"]:hover {
      border-color: #2563eb;
      background: #eef2ff;
    }
    button {
      padding: 12px 20px;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: 0.2s;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
      margin-right: 8px;
    }
    .btn-primary:hover {
      background: #1e4fd6;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #111;
      margin-right: 8px;
    }
    .btn-secondary:hover {
      background: #d1d5db;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 24px;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }
    th {
      background: #f1f5f9;
      font-weight: 600;
      padding: 14px;
      color: #374151;
      border-bottom: 1px solid #e5e7eb;
    }
    td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
    }
    tr:hover td {
      background: #f9fafb;
    }
    #progressContainer {
      width: 100%;
      background: #e5e7eb;
      height: 12px;
      border-radius: 8px;
      margin: 10px 0 20px 0;
      overflow: hidden;
    }
    #progress {
      height: 12px;
      background: #10b981;
      width: 0%;
      color: white;
      font-size: 10px;
      text-align: center;
      line-height: 12px;
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>
  <h1>Roteirizador com Latitude/Longitude</h1>
  <div class="card">

    <h3>Carregar planilha Excel</h3>
    <input type="file" id="fileInput" accept=".xlsx, .xls" />
    <button class="btn-primary" onclick="processarRotas()">Processar Rotas</button>
    <button class="btn-secondary" onclick="exportarExcel()">Gerar Relatório</button>

    <!-- Barra de progresso corrigida -->
    <div style="width:100%; background:#ddd; height:22px; border-radius:5px; margin-top:10px;">
      <div id="progress" style="height:100%; width:0%; background:#2563eb; color:white; text-align:center; border-radius:5px;">
        0%
      </div>
    </div>

    <table id="rotasTabela">
      <thead>
        <tr>
          <th>Origem</th>
          <th>Origem (Lat)</th>
          <th>Origem (Lng)</th>
          <th>Destino</th>
          <th>Destino (Lat)</th>
          <th>Destino (Lng)</th>
          <th>Distância (km)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
let transactions = [];

async function getDrivingDistance(lat1, lon1, lat2, lon2) {
  const url = `https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=false`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data.routes && data.routes.length > 0) {
      return Math.round(data.routes[0].distance / 1000);
    }
  } catch (e) {
    console.error("Erro OSRM", e);
  }
  return null;
}

function parseNumber(value){
  if (!value) return null;
  return parseFloat(String(value).replace(',', '.'));
}

function processarRotas(){
  const file = document.getElementById("fileInput").files[0];
  if (!file) { alert("Selecione um arquivo Excel!"); return; }

  const progress = document.getElementById("progress");
  progress.style.width = "0%";
  progress.textContent = "0%";

  const reader = new FileReader();
  reader.onload = evt => {
    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data, { type: "array" });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    let rows = XLSX.utils.sheet_to_json(sheet);

    transactions = [];

    let total = rows.length;
    let count = 0;

    (async () => {
      for (const r of rows) {
        const origem = r.origem_cidade;
        const destino = r.destino_cidade;
        const lat_o = parseNumber(r.origem_lat);
        const lng_o = parseNumber(r.origem_lng);
        const lat_d = parseNumber(r.destino_lat);
        const lng_d = parseNumber(r.destino_lng);

        if (origem && destino && lat_o && lng_o && lat_d && lng_d) {
          const dist = await getDrivingDistance(lat_o, lng_o, lat_d, lng_d);
          transactions.push({ origem, destino, lat_o, lng_o, lat_d, lng_d, distancia: dist });
        }
        count++;
        let pct = Math.round((count / total) * 100);
        progress.style.width = pct + "%";
        progress.textContent = pct + "%";
      }
      render();
    })();
  };
  reader.readAsArrayBuffer(file);
}

function render() {
  const tbody = document.querySelector('#rotasTabela tbody');
  tbody.innerHTML = '';
  transactions.forEach(t => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${t.origem}</td>
      <td>${t.lat_o}</td>
      <td>${t.lng_o}</td>
      <td>${t.destino}</td>
      <td>${t.lat_d}</td>
      <td>${t.lng_d}</td>
      <td>${t.distancia} km</td>`;
    tbody.appendChild(tr);
  });
}

function exportarExcel(){
  const ws = XLSX.utils.json_to_sheet(transactions);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Rotas");
  XLSX.writeFile(wb, "rotas_processadas.xlsx");
}
</script>

</body>
</html>
