<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roteirização por Latitude/Longitude</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background:#f3f4f6; }
    h1 { margin-bottom: 20px; }
    .card { background:white; padding:20px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    input { padding:8px; width:100%; margin-bottom:10px; }
    button { padding:10px 15px; border-radius:6px; border:0; cursor:pointer; }
    .btn-primary { background:#2563eb; color:white; }
    .btn-secondary { background:#e5e7eb; }
    table { width:100%; border-collapse:collapse; margin-top:20px; background:white; }
    th, td { padding:10px; border-bottom:1px solid #ddd; }
    th { background:#fafafa; }
  </style>
</head>
<body>
  <h1>Roteirizador com Latitude/Longitude</h1>
  <div class="card">

    <h3>Carregar planilha Excel</h3>
    <input type="file" id="fileInput" accept=".xlsx, .xls" />
    <button class="btn-primary" onclick="processExcel()">Processar Rotas</button>
    <button class="btn-secondary" onclick="exportarExcel()">Gerar Relatório</button>

    <table id="rotasTabela">
      <thead>
        <tr>
          <th>Origem (Lat, Lon)</th>
          <th>Destino (Lat, Lon)</th>
          <th>Distância (km)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    let rotas = [];

    function calcularDistancia(lat1, lon1, lat2, lon2) {
      const R = 6371; // raio da Terra em km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return (R * c).toFixed(2);
    }

    function processExcel() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return alert("Selecione um arquivo Excel primeiro");

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);

        rotas = json.map(r => {
          const dist = calcularDistancia(r.Lat_Origem, r.Lon_Origem, r.Lat_Destino, r.Lon_Destino);
          return {
            origem: `${r.Lat_Origem}, ${r.Lon_Origem}`,
            destino: `${r.Lat_Destino}, ${r.Lon_Destino}`,
            distancia: dist
          };
        });

        renderTabela();
      };
      reader.readAsArrayBuffer(file);
    }

    function renderTabela() {
      const tbody = document.querySelector('#rotasTabela tbody');
      tbody.innerHTML = '';

      rotas.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.origem}</td>
          <td>${r.destino}</td>
          <td>${r.distancia} km</td>`;
        tbody.appendChild(tr);
      });
    }

    function exportarExcel() {
      if (rotas.length === 0) return alert("Nenhuma rota processada");

      const ws = XLSX.utils.json_to_sheet(rotas);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Rotas');
      XLSX.writeFile(wb, 'relatorio_rotas.xlsx');
    }
  </script>

</body>
</html>
