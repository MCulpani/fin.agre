<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roteirização por Latitude/Longitude</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background:#f3f4f6; }
    h1 { margin-bottom: 20px; }
    .card { background:white; padding:20px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    input { padding:8px; width:100%; margin-bottom:10px; }
    button { padding:10px 15px; border-radius:6px; border:0; cursor:pointer; }
    .btn-primary { background:#2563eb; color:white; }
    .btn-secondary { background:#e5e7eb; }

    .progress-container{ width:100%; background:#eee; height:26px; border-radius:8px; margin-top:10px; overflow:hidden }
    .progress-bar{ width:0%; height:100%; background:linear-gradient(90deg,#2563eb,#0ea5a4); color:white; text-align:center; line-height:26px; font-weight:700 }

    table { width:100%; border-collapse:collapse; margin-top:20px; background:white; }
    th, td { padding:10px; border-bottom:1px solid #ddd; }
    th { background:#fafafa; }
    .muted{color:#6b7280;font-size:13px}
    @media (max-width:700px){ table, thead, tbody, th, td, tr { display:block } td{ padding:8px } }
  </style>
</head>
<body>
  <h1>Roteirizador com Latitude/Longitude</h1>
  <div class="card">

    <h3>Carregar planilha Excel</h3>
    <div class="muted">A planilha deve conter colunas com estes cabeçalhos (case-sensitive):<br>
      <strong>origem_cidade, origem_lat, origem_lng, destino_cidade, destino_lat, destino_lng</strong>
    </div>
    <input type="file" id="fileInput" accept=".xlsx, .xls" />

    <!-- Barra de progresso -->
    <div class="progress-container" aria-hidden="true">
      <div class="progress-bar" id="progress">0%</div>
    </div>

    <br>

    <button class="btn-primary" id="btnProcess">Processar Rotas</button>
    <button class="btn-secondary" id="btnExport">Gerar Relatório</button>

    <table id="rotasTabela" aria-live="polite">
      <thead>
        <tr>
          <th>Origem</th>
          <th>Origem (Lat)</th>
          <th>Origem (Lng)</th>
          <th>Destino</th>
          <th>Destino (Lat)</th>
          <th>Destino (Lng)</th>
          <th>Distância (km)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    // estado
    let rotas = [];

    function parseNumberPossiblyComma(v){
      if(v === null || v === undefined) return NaN;
      const s = String(v).trim();
      if(s === '') return NaN;
      // replace comma with dot and remove spaces
      const norm = s.replace(/\s+/g,'').replace(',','.');
      const n = parseFloat(norm);
      return isNaN(n) ? NaN : n;
    }

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371; // km
      const toRad = v => (v * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Number((R * c).toFixed(3));
    }

    function setProgress(pct){
      const bar = document.getElementById('progress');
      bar.style.width = pct + '%';
      bar.textContent = pct + '%';
    }

    async function processarRotas(){
      const input = document.getElementById('fileInput');
      const file = input.files[0];
      if(!file){ alert('Selecione um arquivo Excel (.xls/.xlsx)'); return; }

      // reset
      rotas = [];
      renderTabela();
      setProgress(0);

      const reader = new FileReader();
      reader.onload = e => {
        try{
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, {type:'array'});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, {defval: ''});

          if(!rows || rows.length === 0){ alert('Planilha vazia'); return; }

          const total = rows.length;
          let processed = 0;

          for(const r of rows){
            // suportar várias variações de cabeçalho (cases e underscores)
            const origemCidade = r.origem_cidade ?? r.Origem ?? r.CidadeOrigem ?? r['origem cidade'] ?? '';
            const destinoCidade = r.destino_cidade ?? r.Destino ?? r.CidadeDestino ?? r['destino cidade'] ?? '';

            const latO = parseNumberPossiblyComma(r.origem_lat ?? r.LatitudeOrigem ?? r['origem_lat'] ?? r['Origem Lat']);
            const lngO = parseNumberPossiblyComma(r.origem_lng ?? r.LongitudeOrigem ?? r['origem_lng'] ?? r['Origem Lng']);
            const latD = parseNumberPossiblyComma(r.destino_lat ?? r.LatitudeDestino ?? r['destino_lat'] ?? r['Destino Lat']);
            const lngD = parseNumberPossiblyComma(r.destino_lng ?? r.LongitudeDestino ?? r['destino_lng'] ?? r['Destino Lng']);

            if(!isNaN(latO) && !isNaN(lngO) && !isNaN(latD) && !isNaN(lngD)){
              const dist = haversine(latO, lngO, latD, lngD);
              rotas.push({
                origem: origemCidade || '',
                origem_lat: latO,
                origem_lng: lngO,
                destino: destinoCidade || '',
                destino_lat: latD,
                destino_lng: lngD,
                distancia_km: dist
              });
            } else {
              // se faltar coords, ainda adiciona registro com NaN para visualizar erro
              rotas.push({
                origem: origemCidade || '',
                origem_lat: isNaN(latO) ? '' : latO,
                origem_lng: isNaN(lngO) ? '' : lngO,
                destino: destinoCidade || '',
                destino_lat: isNaN(latD) ? '' : latD,
                destino_lng: isNaN(lngD) ? '' : lngD,
                distancia_km: null
              });
            }

            processed++;
            setProgress(Math.round((processed/total)*100));
          }

          renderTabela();
        }catch(err){
          console.error(err);
          alert('Erro ao ler a planilha: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function renderTabela(){
      const tbody = document.querySelector('#rotasTabela tbody');
      tbody.innerHTML = '';
      rotas.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(r.origem)}</td>
          <td>${r.origem_lat !== '' ? r.origem_lat : ''}</td>
          <td>${r.origem_lng !== '' ? r.origem_lng : ''}</td>
          <td>${escapeHtml(r.destino)}</td>
          <td>${r.destino_lat !== '' ? r.destino_lat : ''}</td>
          <td>${r.destino_lng !== '' ? r.destino_lng : ''}</td>
          <td>${r.distancia_km !== null ? r.distancia_km + ' km' : '—'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportarExcel(){
      if(!rotas || rotas.length === 0){ alert('Nenhuma rota processada para exportar'); return; }
      const ws = XLSX.utils.json_to_sheet(rotas);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Rotas');
      // resumo
      const totalKm = rotas.reduce((s,r)=> s + (r.distancia_km || 0), 0);
      const resumo = [{chave: 'rotas_processadas', valor: rotas.length}, {chave: 'distancia_total_km', valor: Number(totalKm.toFixed(3))}];
      const ws2 = XLSX.utils.json_to_sheet(resumo);
      XLSX.utils.book_append_sheet(wb, ws2, 'Resumo');
      XLSX.writeFile(wb, 'rotas_processadas.xlsx');
    }

    function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    document.getElementById('btnProcess').addEventListener('click', processarRotas);
    document.getElementById('btnExport').addEventListener('click', exportarExcel);
  </script>
</body>
</html>
