<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculadora de Distância - KM</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f0f2f5;
      color: #0f172a;
    }
    header {
      background: linear-gradient(90deg,#0f172a,#111827);
      color: white;
      padding: 20px 30px;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(2,6,23,0.12);
    }
    .container { padding: 28px; max-width:1200px; margin:0 auto }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-bottom:20px }
    .card { background: white; padding:18px; border-radius:12px; box-shadow:0 6px 20px rgba(2,6,23,0.06) }
    .kpi-title{ color:#6b7280; font-size:13px }
    .kpi-value{ font-size:26px; font-weight:700; color:#0f172a }
    .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap }
    input[type=file] { padding:12px; border-radius:10px; border:1px dashed #d1d5db; background:#fbfdff; width:360px }
    button { padding:10px 14px; border-radius:10px; border:0; cursor:pointer; font-weight:600 }
    .btn-primary { background:#2563eb; color:white }
    .btn-secondary { background:#e5e7eb; color:#111 }
    .progress-wrapper { margin-top:12px; background:#eef2f6; height:14px; border-radius:8px; overflow:hidden }
    .progress { height:100%; width:0%; background:linear-gradient(90deg,#10b981,#06b6d4); text-align:center; color:white; font-size:12px; line-height:14px }
    table { width:100%; border-collapse:collapse; margin-top:18px; background:white; border-radius:10px; overflow:hidden }
    th, td { text-align:left; padding:10px 12px; border-bottom:1px solid #eef2f6 }
    th { background:#fbfdff; font-weight:700 }
    @media (max-width:720px){ input[type=file]{ width:100% } .controls{flex-direction:column; align-items:stretch} }

     /* LOGIN */
    #login-overlay{
      position:fixed; inset:0; background:#111827; display:flex; align-items:center; justify-content:center;
      z-index:9999;
    }
    #login-box{
      background:#fff; padding:30px; width:360px; border-radius:12px;
      box-shadow:0 6px 20px rgba(0,0,0,0.35);
    }
    #login-box input{
      width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; margin-bottom:12px;
    }
    #loginMsg{ color:#b91c1c; display:none; font-size:13px; margin-top:10px; }
  </style>
</head>
<body>
  
<!-- LOGIN -->
<div id="login-overlay">
  <div id="login-box">
    <h2 style="text-align:center; margin:0 0 12px 0;">Login</h2>
    <input id="loginUser" placeholder="Usuário">
    <input id="loginPass" type="password" placeholder="Senha">

    <button id="loginBtn" class="btn-primary" style="width:100%; font-weight:700;">Entrar</button>
    <div id="loginMsg"></div>
  </div>
</div>

  <header>Calculadora de Distância - KM</header>
  <div class="container">
    <div class="grid" id="kpiGrid">
      <div class="card">
        <div class="kpi-title">Total de Rotas</div>
        <div id="kpi_total" class="kpi-value">0</div>
      </div>
      <div class="card">
        <div class="kpi-title">Distância Total (km)</div>
        <div id="kpi_dist_total" class="kpi-value">0</div>
      </div>
      <div class="card">
        <div class="kpi-title">Maior Rota (km)</div>
        <div id="kpi_maior" class="kpi-value">0</div>
      </div>
      <div class="card">
        <div class="kpi-title">Menor Rota (km)</div>
        <div id="kpi_menor" class="kpi-value">0</div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px 0">Importar & Processar</h3>
      <div class="controls">
        <input type="file" id="fileInput" accept=".xlsx, .xls" />
        <button id="btnProcess" class="btn-primary">Calcular</button>
        <button id="btnExport" class="btn-secondary">Exportar</button>
        <button id="btnTemplate" class="btn-secondary">Baixar Template</button>
        <button id="btnBase" class="btn-secondary">Base - Latitude e Longitude - Brasil</button>
      </div>

      <div class="progress-wrapper" style="display:none;" id="progressWrap">
        <div id="progress" class="progress">0%</div>
      </div>

      <table id="rotasTabela">
        <thead>
          <tr>
            <th>Origem</th>
            <th>Origem (Lat)</th>
            <th>Origem (Lng)</th>
            <th>Destino</th>
            <th>Destino (Lat)</th>
            <th>Destino (Lng)</th>
            <th>Distância (km)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js">
// Gerar template de importação
function baixarTemplate() {
    const exemplo = [
        {
            origem_cidade: "Itajaí/SC",
            origem_lat: -26.9101,
            origem_lng: -48.6705,
            destino_cidade: "Navegantes/SC",
            destino_lat: -26.8946,
            destino_lng: -48.6546
        }
    ];

    const ws = XLSX.utils.json_to_sheet(exemplo);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Template');

    XLSX.writeFile(wb, "template_importacao.xlsx");
}

document.getElementById("btnTemplate").addEventListener("click", baixarTemplate);


// Baixar base fixa de latitude e longitude
function baixarBase() {
    const link = document.createElement("a");
    link.href = "Base - Latitude e Longitude - Brasil.xlsx"; 
    link.download = "Base - Latitude e Longitude - Brasil.xlsx";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

document.getElementById("btnBase").addEventListener("click", baixarBase);

</script>
  <script>
    // LOGIN FUNCIONAL — FIXADO

document.addEventListener("DOMContentLoaded", () => {
  const overlay = document.getElementById("login-overlay");
  const user = document.getElementById("loginUser");
  const pass = document.getElementById("loginPass");
  const btn  = document.getElementById("loginBtn");
  const msg  = document.getElementById("loginMsg");

  function doLogin(){
    if(user.value === "MCulpani" && pass.value === "teste123"){
      overlay.style.display = "none";
      msg.style.display = "none";
    } else {
      msg.textContent = "Usuário ou senha incorretos!";
      msg.style.display = "block";
    }
  }

  btn.addEventListener("click", doLogin);
  pass.addEventListener("keydown", e => { if(e.key === "Enter") doLogin(); });
});

    // estado
    let rotas = [];

    async function getDrivingDistance(lat1, lon1, lat2, lon2){
      const url = `https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=false`;
      try{ const res = await fetch(url); const data = await res.json(); if(data.routes && data.routes.length) return Number((data.routes[0].distance/1000).toFixed(3)); }catch(e){console.error('OSRM',e)}
      return null;
    }

    function parseNumber(v){ if(v===null||v===undefined) return null; const s = String(v).trim().replace(/\s+/g,'').replace(',','.'); const n = parseFloat(s); return isNaN(n) ? null : n; }

    function showProgress(pct){ const wrap = document.getElementById('progressWrap'); wrap.style.display = 'block'; const bar = document.getElementById('progress'); bar.style.width = pct + '%'; bar.textContent = pct + '%'; }
    function hideProgress(){ document.getElementById('progressWrap').style.display = 'none'; }

    async function processarRotas(){
      const input = document.getElementById('fileInput'); const file = input.files[0]; if(!file){ alert('Selecione um arquivo Excel (.xls/.xlsx)'); return; }
      rotas = []; renderTable(); showProgress(0);

      const reader = new FileReader();
      reader.onload = async (e) => {
        try{
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data,{type:'array'});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
          const total = rows.length; let processed = 0;

          for(const r of rows){
            const origem = r.origem_cidade ?? r.Origem ?? r['origem cidade'] ?? '';
            const destino = r.destino_cidade ?? r.Destino ?? r['destino cidade'] ?? '';
            const lat_o = parseNumber(r.origem_lat ?? r.LatitudeOrigem ?? r['origem_lat']);
            const lng_o = parseNumber(r.origem_lng ?? r.LongitudeOrigem ?? r['origem_lng']);
            const lat_d = parseNumber(r.destino_lat ?? r.LatitudeDestino ?? r['destino_lat']);
            const lng_d = parseNumber(r.destino_lng ?? r.LongitudeDestino ?? r['destino_lng']);

            if(origem && destino && lat_o !== null && lng_o !== null && lat_d !== null && lng_d !== null){
              const dist = await getDrivingDistance(lat_o,lng_o,lat_d,lng_d);
              rotas.push({origem,destino,lat_o,lng_o,lat_d,lng_d,distancia:dist});
            } else {
              // adiciona registro com erro visual
              rotas.push({origem,destino,lat_o,lng_o,lat_d,lng_d,distancia:null});
            }

            processed++; showProgress(Math.round((processed/total)*100));
          }

          renderTable(); updateKPIs(); hideProgress();
        }catch(err){ console.error(err); alert('Erro ao processar planilha: '+err.message); hideProgress(); }
      };
      reader.readAsArrayBuffer(file);
    }

    function renderTable(){
      const tbody = document.querySelector('#rotasTabela tbody'); tbody.innerHTML = '';
      rotas.forEach(r=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(r.origem)}</td>
          <td>${r.lat_o ?? ''}</td>
          <td>${r.lng_o ?? ''}</td>
          <td>${escapeHtml(r.destino)}</td>
          <td>${r.lat_d ?? ''}</td>
          <td>${r.lng_d ?? ''}</td>
          <td>${r.distancia !== null && r.distancia !== undefined ? r.distancia + ' km' : '—'}</td>`;
        tbody.appendChild(tr);
      });
    }

    function updateKPIs(){
      document.getElementById('kpi_total').textContent = rotas.length;
      const values = rotas.map(r=>r.distancia).filter(v=>typeof v==='number');
      const totalKm = values.reduce((s,v)=>s+v,0);
      document.getElementById('kpi_dist_total').textContent = totalKm.toFixed(3) + ' km';
      document.getElementById('kpi_maior').textContent = (values.length? Math.max(...values).toFixed(3):0) + ' km';
      document.getElementById('kpi_menor').textContent = (values.length? Math.min(...values).toFixed(3):0) + ' km';
    }

    function exportarExcel(){ if(!rotas || rotas.length===0){ alert('Nenhuma rota processada'); return; } const ws = XLSX.utils.json_to_sheet(rotas); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Rotas'); XLSX.writeFile(wb,'rotas_processadas.xlsx'); }

    function escapeHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    document.getElementById('btnProcess').addEventListener('click', processarRotas);
    document.getElementById('btnExport').addEventListener('click', exportarExcel);
  
// Gerar template de importação
function baixarTemplate() {
    const exemplo = [
        {
            origem_cidade: "Itajaí/SC",
            origem_lat: -26.9101,
            origem_lng: -48.6705,
            destino_cidade: "Navegantes/SC",
            destino_lat: -26.8946,
            destino_lng: -48.6546
        }
    ];

    const ws = XLSX.utils.json_to_sheet(exemplo);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Template');

    XLSX.writeFile(wb, "template_importacao.xlsx");
}

document.getElementById("btnTemplate").addEventListener("click", baixarTemplate);


// Baixar base fixa de latitude e longitude
function baixarBase() {
    const link = document.createElement("a");
    link.href = "Base - Latitude e Longitude - Brasil.xlsx"; 
    link.download = "Base - Latitude e Longitude - Brasil.xlsx";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

document.getElementById("btnBase").addEventListener("click", baixarBase);

</script>
</body>
</html>
