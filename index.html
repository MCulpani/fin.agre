<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Processador de Rotas</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        h2 {
            margin-bottom: 10px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            max-width: 700px;
            margin: auto;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-primary {
            background: #007bff;
            color: white;
        }
        .btn-secondary {
            background: #28a745;
            color: white;
        }
        #log {
            margin-top: 20px;
            padding: 10px;
            background: #eee;
            border-radius: 8px;
            min-height: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Processador de Rotas por Latitude/Longitude</h2>

        <h3>Carregar Planilha Excel</h3>
        <input type="file" id="fileInput" accept=".xlsx, .xls" />
        <br />

        <button class="btn-primary" onclick="processExcel()">Processar Rotas</button>
        <button class="btn-secondary" onclick="exportarExcel()">Gerar Relatório</button>

        <div id="log"></div>
    </div>

<script>
let rotasProcessadas = [];

function log(msg) {
    document.getElementById("log").innerText = msg;
}

function processExcel() {
    const input = document.getElementById("fileInput");
    const file = input.files[0];

    if (!file) {
        alert("Selecione uma planilha primeiro.");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];

        const json = XLSX.utils.sheet_to_json(sheet);

        if (json.length === 0) {
            alert("Planilha vazia.");
            return;
        }

        rotasProcessadas = json.map((linha) => {
            const lat1 = Number(linha.LatitudeOrigem);
            const lon1 = Number(linha.LongitudeOrigem);
            const lat2 = Number(linha.LatitudeDestino);
            const lon2 = Number(linha.LongitudeDestino);

            const km = calcularDistancia(lat1, lon1, lat2, lon2);

            return {
                CidadeOrigem: linha.CidadeOrigem,
                CidadeDestino: linha.CidadeDestino,
                LatitudeOrigem: lat1,
                LongitudeOrigem: lon1,
                LatitudeDestino: lat2,
                LongitudeDestino: lon2,
                DistanciaKm: km
            };
        });

        log("Rotas processadas com sucesso!");
        console.log(rotasProcessadas);
    };

    reader.readAsArrayBuffer(file);
}

function calcularDistancia(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return Number((R * c).toFixed(2));
}

function exportarExcel() {
    if (rotasProcessadas.length === 0) {
        alert("Nenhuma rota processada.");
        return;
    }

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(rotasProcessadas);

    XLSX.utils.book_append_sheet(wb, ws, "RelatorioRotas");
    XLSX.writeFile(wb, "relatorio_rotas.xlsx");
}
</script>

</body>
</html>
