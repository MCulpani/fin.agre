<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Conciliação de Caixa — MVP</title>
  <style>
    :root{--bg:#f6f8fb;--card:#fff;--accent:#2b6cb0;--muted:#6b7280}
    body{font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);margin:0;padding:24px;color:#111}
    .wrap{max-width:980px;margin:0 auto}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{font-size:20px;margin:0}
    .card{background:var(--card);padding:16px;border-radius:12px;box-shadow:0 6px 18px rgba(14,20,30,0.06);}
    form{display:grid;grid-template-columns:1fr 1fr 120px 120px;gap:10px;align-items:end}
    label{font-size:12px;color:var(--muted)}
    input,select{padding:8px;border-radius:8px;border:1px solid #e6e9ef;width:100%;box-sizing:border-box}
    button{padding:10px 14px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
    .summary{display:flex;gap:12px;margin-top:12px}
    .summary .item{flex:1;padding:12px;border-radius:10px;background:#fff;text-align:center}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{padding:10px;border-bottom:1px solid #eef2f7;text-align:left}
    .right{text-align:right}
    .muted{color:var(--muted);font-size:13px}
    .btn-ghost{background:transparent;border:1px solid #e2e8f0;color:#111;padding:6px 10px;border-radius:8px}
    .reconciled{background:#edfff3;color:#065f46;padding:6px 8px;border-radius:8px;font-weight:600}
    .actions button{margin-left:6px}
    footer{margin-top:18px;color:var(--muted);font-size:13px}
    #syncStatus{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
    #syncStatus.ok{color:green}
    #syncStatus.error{color:#b91c1c}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Conciliação de Caixa — MVP</h1>
      <div id="syncStatus">Sincronizando…</div>
    </header>

    <section class="card">
      <form id="txForm">
        <div>
          <label for="date">Data</label>
          <input id="date" type="date" required />
        </div>
        <div>
          <label for="desc">Descrição</label>
          <input id="desc" type="text" placeholder="Ex: Venda, pagamento" required />
        </div>
        <div>
          <label for="type">Tipo</label>
          <select id="type">
            <option value="credit">Crédito</option>
            <option value="debit">Débito</option>
          </select>
        </div>
        <div>
          <label for="amount">Valor (R$)</label>
          <input id="amount" type="number" step="0.01" placeholder="0.00" required />
        </div>
        <div style="grid-column:1 / -1;display:flex;gap:8px;margin-top:6px">
          <button id="addBtn" type="submit">Adicionar transação</button>
          <button id="clearBtn" type="button" class="btn-ghost">Limpar formulário</button>
          <button id="syncBtn" type="button" class="btn-ghost">Forçar sincronia</button>
        </div>
      </form>

      <div class="summary" id="summary">
        <div class="item">
          <div class="muted">Saldo Inicial</div>
          <div id="initialBalance">R$ 0,00</div>
        </div>
        <div class="item">
          <div class="muted">Entradas</div>
          <div id="credits">R$ 0,00</div>
        </div>
        <div class="item">
          <div class="muted">Saídas</div>
          <div id="debits">R$ 0,00</div>
        </div>
        <div class="item">
          <div class="muted">Saldo Atual</div>
          <div id="balance">R$ 0,00</div>
        </div>
      </div>

      <table id="txTable">
        <thead>
          <tr><th>Data</th><th>Descrição</th><th>Tipo</th><th class="right">Valor</th><th>Estado</th><th>Ações</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <footer>
        <div class="muted">Aviso: em produção configure regras de segurança no Firebase e adicione autenticação.</div>
      </footer>
    </section>
  </div>

  <!-- Firebase modular v12 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

    // Config do seu projeto (fin-agre) — já com databaseURL
    const firebaseConfig = {
      apiKey: "AIzaSyAIZ-TJHzBgAVXQ1XuN6Z7CVvI93pSM-4Q",
      authDomain: "fin-agre.firebaseapp.com",
      projectId: "fin-agre",
      storageBucket: "fin-agre.firebasestorage.app",
      messagingSenderId: "841191455272",
      appId: "1:841191455272:web:3779751e0a1c424a7bd31d",
      measurementId: "G-513KYHHPMG",
      databaseURL: "https://fin-agre-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const txRef = ref(db, 'transactions');

    // UI
    const form = document.getElementById('txForm');
    const tableBody = document.querySelector('#txTable tbody');
    const creditsEl = document.getElementById('credits');
    const debitsEl = document.getElementById('debits');
    const balanceEl = document.getElementById('balance');
    const initialBalanceEl = document.getElementById('initialBalance');
    const syncStatusEl = document.getElementById('syncStatus');

    // Estado
    let transactions = {};
    let initialBalance = 0.00;

    function fmt(v){
      return 'R$ ' + Number(v || 0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    }

    function escapeHtml(unsafe) {
      return String(unsafe||'')
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function setSync(status, msg){
      syncStatusEl.classList.remove('ok','error');
      if(status === 'ok'){
        syncStatusEl.classList.add('ok');
        syncStatusEl.textContent = '✔ Sincronizado';
      } else if(status === 'error'){
        syncStatusEl.classList.add('error');
        syncStatusEl.textContent = 'Erro: ' + (msg||'');
      } else {
        syncStatusEl.textContent = 'Sincronizando…';
      }
    }

    function render(){
      tableBody.innerHTML = '';
      let credits = 0, debits = 0;
      const keys = Object.keys(transactions || {});
      // Sort by date desc
      keys.sort((a,b)=>{
        const da = transactions[a] && transactions[a].date ? new Date(transactions[a].date) : new Date(0);
        const dbd = transactions[b] && transactions[b].date ? new Date(transactions[b].date) : new Date(0);
        return dbd - da;
      });

      keys.forEach(key=>{
        const tx = transactions[key];
        if(!tx) return;
        const tr = document.createElement('tr');
        tr.innerHTML = '<td>'+ (tx.date||'') +'</td>'+
                       '<td>'+ escapeHtml(tx.desc) +'</td>'+
                       '<td>'+(tx.type==='credit'?'Crédito':'Débito')+'</td>'+
                       '<td class="right">'+ fmt(tx.amount) +'</td>'+
                       '<td>'+(tx.reconciled?'<span class="reconciled">Conciliado</span>':'<span class="muted">Pendente</span>')+'</td>'+
                       '<td class="actions">'
                         +'<button class="btn-ghost" data-action="toggle" data-id="'+key+'">Toggle</button>'
                         +'<button class="btn-ghost" data-action="delete" data-id="'+key+'">Excluir</button>'
                       +'</td>';
        tableBody.appendChild(tr);
        if(tx.type==='credit') credits += Number(tx.amount||0);
        else debits += Number(tx.amount||0);
      });

      creditsEl.textContent = fmt(credits);
      debitsEl.textContent = fmt(debits);
      balanceEl.textContent = fmt(initialBalance + credits - debits);
      initialBalanceEl.textContent = fmt(initialBalance);
    }

    // Listen for changes
    setSync('loading');
    onValue(txRef, (snapshot)=>{
      try{
        setSync('loading');
        const val = snapshot.val() || {};
        if(val._initialBalance !== undefined) initialBalance = Number(val._initialBalance);
        const copy = Object.assign({}, val);
        delete copy._initialBalance;
        transactions = copy;
        render();
        setSync('ok');
      }catch(err){
        console.error('Erro lendo DB:', err);
        setSync('error', err.message);
      }
    }, (error)=>{
      console.error('onValue error:', error);
      setSync('error', error && error.message ? error.message : String(error));
    });

    // Form submit
    form.addEventListener('submit', async function(e){
      e.preventDefault();
      const date = document.getElementById('date').value;
      const desc = document.getElementById('desc').value.trim();
      const type = document.getElementById('type').value;
      const amount = parseFloat(document.getElementById('amount').value) || 0;
      if(!date || !desc || amount===0){ alert('Preencha todos os campos corretamente.'); return; }
      const payload = { date: date, desc: desc, type: type, amount: Number(amount), reconciled: false };
      try{
        setSync('loading');
        await push(txRef, payload);
        form.reset();
        setSync('ok');
      }catch(err){
        console.error('Erro ao salvar:', err);
        setSync('error', err && err.message ? err.message : String(err));
        alert('Erro ao salvar: ' + (err && err.message ? err.message : String(err)));
      }
    });

    document.getElementById('clearBtn').addEventListener('click', function(){ form.reset(); });
    document.getElementById('syncBtn').addEventListener('click', function(){
      setSync('loading');
      get(txRef).then(s=>{
        transactions = s.val() || {};
        render();
        setSync('ok');
      }).catch(err=>{ setSync('error', err.message); console.error(err); });
    });

    // Table actions
    tableBody.addEventListener('click', function(e){
      const btn = e.target.closest('button'); if(!btn) return;
      const action = btn.dataset.action, id = btn.dataset.id;
      if(action === 'delete'){
        if(!confirm('Excluir transação?')) return;
        remove(ref(db, 'transactions/' + id)).catch(err=>{ setSync('error', err.message); console.error(err); alert('Erro: '+err.message); });
      } else if(action === 'toggle'){
        const cur = transactions[id]; if(!cur) return;
        update(ref(db, 'transactions/' + id), { reconciled: !cur.reconciled }).catch(err=>{ setSync('error', err.message); console.error(err); alert('Erro: '+err.message); });
      }
    });

    // inicial render
    render();
  </script>
</body>
</html>
