<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roteirização por Latitude/Longitude</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background:#f3f4f6; }
    h1 { margin-bottom: 20px; }
    .card { background:white; padding:20px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    input { padding:8px; width:100%; margin-bottom:10px; }
    button { padding:10px 15px; border-radius:6px; border:0; cursor:pointer; }
    .btn-primary { background:#2563eb; color:white; }
    .btn-secondary { background:#e5e7eb; }
    table { width:100%; border-collapse:collapse; margin-top:20px; background:white; }
    th, td { padding:10px; border-bottom:1px solid #ddd; }
    th { background:#fafafa; }
  </style>
</head>
<body>
  <h1>Roteirizador com Latitude/Longitude</h1>
  <div class="card">

    <h3>Carregar planilha Excel</h3>
    <input type="file" id="fileInput" accept=".xlsx, .xls" />
    <button class="btn-primary" onclick="processExcel()">Processar Rotas</button>
    <button class="btn-secondary" onclick="exportarExcel()">Gerar Relatório</button>

    <table id="rotasTabela">
      <thead>
        <tr>
          <th>Origem (Lat, Lon)</th>
          <th>Destino (Lat, Lon)</th>
          <th>Distância (km)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
let transactions = [];

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const toRad = v => (v * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    const data = new Uint8Array(evt.target.result);
    const workbook = XLSX.read(data, { type: "array" });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet);
    transactions = [];
    rows.forEach(r => {
      if (r.origem_lat && r.origem_lng && r.destino_lat && r.destino_lng) {
        const dist = haversine(r.origem_lat, r.origem_lng, r.destino_lat, r.destino_lng);
        transactions.push({
          origem_cidade: r.origem_cidade || "",
          origem_lat: r.origem_lat,
          origem_lng: r.origem_lng,
          destino_cidade: r.destino_cidade || "",
          destino_lat: r.destino_lat,
          destino_lng: r.destino_lng,
          distancia_km: dist
        });
      }
    });
    render();
  };
  reader.readAsArrayBuffer(file);
});

function render() {
  const tbody = document.querySelector('#txTable tbody');
  tbody.innerHTML = '';
  transactions.forEach(t => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${t.origem_cidade}</td>
      <td>${t.origem_lat}</td>
      <td>${t.origem_lng}</td>
      <td>${t.destino_cidade}</td>
      <td>${t.destino_lat}</td>
      <td>${t.destino_lng}</td>
      <td>${t.distancia_km} km</td>`;
    tbody.appendChild(tr);
  });
}

document.getElementById("exportExcel").addEventListener("click", () => {
  const ws = XLSX.utils.json_to_sheet(transactions);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Rotas");
  XLSX.writeFile(wb, "rotas_processadas.xlsx");
});
</script>

</body>
</html>
