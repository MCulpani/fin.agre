<!-- Código atualizado: layout antigo + exportação Excel real (XLSX) -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Conciliação de Caixa — MVP</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f3f4f6; margin:0; padding:20px; }
    h1 { margin-bottom:20px; }
    .card { background:white; padding:15px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    label { font-size:13px; color:#555; }
    input, select { padding:7px; margin-bottom:10px; width:100%; box-sizing:border-box; }
    button { padding:10px 15px; border-radius:6px; border:0; cursor:pointer; }
    .btn-primary { background:#2563eb; color:white; }
    .btn-secondary { background:#e5e7eb; color:#111; }
    .summary { display:flex; gap:12px; margin-top:12px; }
    .item { flex:1; background:#fff; padding:12px; border-radius:8px; text-align:center; }
    table { width:100%; border-collapse:collapse; margin-top:20px; background:white; }
    th, td { padding:10px; border-bottom:1px solid #ddd; }
    th { background:#fafafa; }
    .right { text-align:right; }
    .reconciled { color:green; font-weight:bold; }
    .muted { color:#666; font-size:13px; }
  </style>
</head>
<body>
  <h1>Conciliação de Caixa</h1>
  <div class="card">
    <form id="txForm">
      <label>Data</label>
      <input id="date" type="date" required />

      <label>Descrição</label>
      <input id="desc" type="text" required />

      <label>Tipo</label>
      <select id="type">
        <option value="credit">Crédito</option>
        <option value="debit">Débito</option>
      </select>

      <label>Valor (R$)</label>
      <input id="amount" type="number" step="0.01" required />

      <button class="btn-primary" type="submit">Adicionar</button>
      <button id="exportExcel" type="button" class="btn-secondary">Gerar Relatório (Excel)</button>
    </form>

    <div class="summary">
      <div class="item"><div class="muted">Entradas</div><div id="credits">R$ 0,00</div></div>
      <div class="item"><div class="muted">Saídas</div><div id="debits">R$ 0,00</div></div>
      <div class="item"><div class="muted">Saldo</div><div id="balance">R$ 0,00</div></div>
    </div>

    <table id="txTable">
      <thead>
        <tr><th>Data</th><th>Descrição</th><th>Tipo</th><th class="right">Valor</th><th>Estado</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- XLSX -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    let transactions = [];

    function fmt(v){ return 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2}); }

    function render(){
      const tbody = document.querySelector('#txTable tbody');
      tbody.innerHTML = '';

      let credits = 0, debits = 0;

      transactions.forEach(t => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${t.date}</td>
          <td>${t.desc}</td>
          <td>${t.type === 'credit' ? 'Crédito' : 'Débito'}</td>
          <td class="right">${fmt(t.amount)}</td>
          <td>${t.reconciled ? '<span class="reconciled">Conciliado</span>' : '<span class="muted">Pendente</span>'}</td>
        `;
        tbody.appendChild(tr);

        if(t.type === 'credit') credits += t.amount;
        else debits += t.amount;
      });

      document.getElementById('credits').textContent = fmt(credits);
      document.getElementById('debits').textContent = fmt(debits);
      document.getElementById('balance').textContent = fmt(credits - debits);
    }

    document.getElementById('txForm').addEventListener('submit', e => {
      e.preventDefault();
      const tx = {
        date: document.getElementById('date').value,
        desc: document.getElementById('desc').value,
        type: document.getElementById('type').value,
        amount: Number(document.getElementById('amount').value),
        reconciled: false
      };
      transactions.push(tx);
      render();
      e.target.reset();
    });

    // EXPORTAÇÃO REAL XLSX CORRIGIDA
    document.getElementById('exportExcel').addEventListener('click', () => {
      const rows = transactions.map(t => ({
        Data: t.date,
        Descrição: t.desc,
        Tipo: t.type === 'credit' ? 'Crédito' : 'Débito',
        Valor: t.amount,
        Conciliado: t.reconciled ? 'Sim' : 'Não'
      }));

      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Relatório');
      XLSX.writeFile(wb, 'relatorio_conciliacao.xlsx');
    });
  </script>
</body>
</html>
