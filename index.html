<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roteirização Automática — Cálculo de Distâncias</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body{font-family:Arial;background:#f3f4f6;margin:0;padding:20px;}
    h1{margin-bottom:20px;}
    .card{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,0.1);} 
    input{padding:8px;width:100%;margin-bottom:12px;} 
    button{padding:10px 15px;border:0;border-radius:6px;cursor:pointer;margin-right:6px;} 
    .btn{background:#2563eb;color:white;} 
    .btn-secondary{background:#e5e7eb;color:#111;} 
    table{width:100%;margin-top:20px;border-collapse:collapse;background:white;} 
    th,td{padding:10px;border-bottom:1px solid #ddd;} 
  </style>
</head>
<body>
  <h1>Roteirização Automática via Google Distance Matrix</h1>

  <div class="card">
    <label>Sua Google API Key</label>
    <input id="apikey" placeholder="Cole aqui sua Google API Key" />

    <label>Importar planilha Excel (com coluna ORIGEM e DESTINO)</label>
    <input type="file" id="fileInput" accept=".xlsx,.xls" />

    <button class="btn" onclick="processarPlanilha()">Gerar Distâncias</button>
    <button class="btn-secondary" onclick="limpar()">Limpar Tudo</button>

    <table id="resultado" style="display:none;">
      <thead>
        <tr>
          <th>Origem</th><th>Destino</th><th>Distância (km)</th><th>Duração</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <button id="exportar" class="btn" style="display:none;" onclick="exportarExcel()">Exportar Excel</button>
  </div>

<script>
let dadosRotas = [];

function limpar(){
  dadosRotas = [];
  document.querySelector('#resultado').style.display='none';
  document.querySelector('#resultado tbody').innerHTML='';
  document.querySelector('#exportar').style.display='none';
}

async function buscarDistancia(origem, destino, apiKey){
  const url = `https://maps.googleapis.com/maps/api/distancematrix/json?origins=${encodeURIComponent(origem)}&destinations=${encodeURIComponent(destino)}&key=${apiKey}&mode=driving`;
  const resp = await fetch(url);
  const data = await resp.json();

  if(data.rows && data.rows[0].elements[0].status === "OK"){
    return {
      distancia: data.rows[0].elements[0].distance.text,
      duracao: data.rows[0].elements[0].duration.text
    };
  }
  return { distancia:"Erro", duracao:"Erro" };
}

function processarPlanilha(){
  const file = document.getElementById('fileInput').files[0];
  const apiKey = document.getElementById('apikey').value.trim();
  if(!file) return alert("Selecione uma planilha.");
  if(!apiKey) return alert("Insira sua Google API Key.");

  const reader = new FileReader();

  reader.onload = async (e)=>{
    const data = new Uint8Array(e.target.result);
    const wb = XLSX.read(data,{type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(ws);

    dadosRotas = [];
    document.querySelector('#resultado tbody').innerHTML = '';

    for(const linha of json){
      const origem = linha.ORIGEM;
      const destino = linha.DESTINO;
      if(!origem || !destino) continue;

      const r = await buscarDistancia(origem, destino, apiKey);

      dadosRotas.push({ origem, destino, distancia:r.distancia, duracao:r.duracao });

      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${origem}</td><td>${destino}</td><td>${r.distancia}</td><td>${r.duracao}</td>`;
      document.querySelector('#resultado tbody').appendChild(tr);
    }

    document.querySelector('#resultado').style.display='table';
    document.querySelector('#exportar').style.display='inline-block';
  };

  reader.readAsArrayBuffer(file);
}

function exportarExcel(){
  const ws = XLSX.utils.json_to_sheet(dadosRotas);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Rotas');
  XLSX.writeFile(wb, 'resultado_rotas.xlsx');
}
</script>

</body>
</html>
